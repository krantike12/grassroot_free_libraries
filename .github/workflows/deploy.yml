name: Deploy React App and Node.js Backend

on:
  workflow_dispatch:

jobs:
  # 1. FRONTEND DEPLOYMENT (React Build)
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Frontend)
        # Assuming package.json is in the root for React
        run: npm ci

      - name: Build React app
        run: CI=false npm run build

      - name: Deploy Frontend (./build) via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            port: 22999
            local_path: ./build/*
            remote_path: public_html/map-libraries
            sftp_only: true
            rsyncArgs: '--exclude=*.map'
            sftpArgs: '-o ConnectTimeout=5'

  # 2. BACKEND DEPLOYMENT (Node.js Folder)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend # Ensures backend starts deploying after frontend job is initiated
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        # Navigate into the backend folder to install its dependencies
        run: cd backend && npm ci

      - name: Deploy Backend (./backend) via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            port: 22999
            # Use the local path of your backend folder
            local_path: ./backend/*
            # ⚠️ IMPORTANT: CHANGE THIS PATH! 
            # This must be the specific path where your MilesWeb/cPanel Node.js app is set up (e.g., outside public_html).
            remote_path: /home/${{ secrets.FTP_USERNAME }}/backend
            sftp_only: true
            sftpArgs: '-o ConnectTimeout=5'